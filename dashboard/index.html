<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACRDX price monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <h1>ACRDX price monitor</h1>
  </header>

  <main class="panel">
    <section id="status" class="card status">
      <div class="status-head" aria-live="polite">
        <p id="status-word" class="status-word">Loading</p>
        <p id="status-detail" class="status-detail"></p>
      </div>
      <div class="days">
        <p class="label">Worst result of each day, UTC. Select a day, then a scan, to see what was read.</p>
        <div id="days-strip" class="days-strip"></div>
        <div class="days-axis"><span id="days-first"></span><span id="days-last"></span></div>
      </div>
      <div id="day-scans" class="day-scans" hidden>
        <h2 id="day-scans-title"></h2>
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th>Scan</th><th>Result</th><th>Price age</th><th>Spoke against Chronicle</th><th>Block</th></tr>
            </thead>
            <tbody id="day-scans-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <div class="checks">
      <section id="check-age" class="card check"></section>
      <section id="check-divergence" class="card check"></section>
    </div>

    <section class="card readings">
      <h2 id="readings-title">What the monitor read</h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>Source</th><th>Block</th><th>Price</th><th>Price computed at</th><th>Read</th></tr>
          </thead>
          <tbody id="readings-body"></tbody>
        </table>
      </div>
    </section>
  </main>


  <script src="app.js"></script>
</body>
</html>
