name: monitor

# One scan every 15 minutes: read and judge, commit the data, publish the page.
# GitHub starts scheduled runs late or skips them; the page says "monitor not running"
# when the last run is older than 45 minutes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dashboard/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Editable install: the checker writes to data/ next to the package
      - run: pip install -e .

      # A failed read does not fail this step: it writes a no_verdict run, and the page shows it
      - name: Scan
        run: python -m checker.main
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}

      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.jsonl
          git commit -m "data: scan of $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      # Same layout as the dashboard service in compose.yaml: data/ under the page root
      - name: Build the page
        run: |
          mkdir _site
          cp -r dashboard/. _site/
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
